<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0f1a"/><stop offset="1" stop-color="#1a0f24"/></linearGradient>
 <linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#ff2d55"/><stop offset=".5" stop-color="#ff7a59"/><stop offset="1" stop-color="#42d392"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".05"/></pattern>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<rect width="1200" height="300" rx="18" fill="url(#grid)"/>
<g font-family="Consolas,Menlo,monospace" font-size="13" fill="#8b9bb4" opacity=".55">
 <text x="40" y="40">Route::middleware('auth:api')-&gt;group(fn () =&gt; ...);</text>
 <text x="760" y="40">broadcast(new OrderShipped($order))-&gt;toOthers();</text>
 <text x="40" y="275">Location::whereDistanceSphere('point', $p, '&lt;', 5000)-&gt;get();</text>
 <text x="760" y="275">AI::provider('any')-&gt;automate($growth);</text>
</g>
<g filter="url(#glow)">
 <text x="600" y="140" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="72" font-weight="800" fill="url(#neon)" letter-spacing="2">KARIM HAMDY</text>
</g>
<text x="600" y="185" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="19" fill="#e6edf3">
 Backend &amp; AI Engineer · Laravel · Automation · Real-time
</text>
<text x="600" y="220" text-anchor="middle" font-family="Consolas,Menlo,monospace" font-size="16" fill="#42d392">$ php artisan ai:automate --growth</text>
<rect x="774" y="205" width="10" height="20" fill="#42d392"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
<!-- travelling packet -->
<line x1="120" y1="245" x2="1080" y2="245" stroke="#ffffff" stroke-opacity=".08" stroke-width="2"/>
<circle r="5" cy="245" fill="#ff2d55" filter="url(#glow)"><animate attributeName="cx" from="120" to="1080" dur="4s" repeatCount="indefinite"/></circle>
<circle r="5" cy="245" fill="#42d392" filter="url(#glow)"><animate attributeName="cx" from="1080" to="120" dur="4s" begin="2s" repeatCount="indefinite"/></circle>
</svg>
