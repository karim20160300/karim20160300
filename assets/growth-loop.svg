 <g transform="translate(600,160)"><rect x="-80" y="-58" width="160" height="80" rx="14" fill="#121827" stroke="#4cc9f0" stroke-width="2"/><text y="-26" font-size="17" font-weight="700" fill="#4cc9f0">3 · Decide</text><text y="-4" font-size="12" fill="#8b9bb4">score · route · prioritise</text></g>
 <g transform="translate(820,160)"><rect x="-80" y="-58" width="160" height="80" rx="14" fill="#121827" stroke="#42d392" stroke-width="2"/><text y="-26" font-size="17" font-weight="700" fill="#42d392">4 · Act</text><text y="-4" font-size="12" fill="#8b9bb4">message · CRM · task</text></g>
 <g transform="translate(1040,160)"><rect x="-80" y="-58" width="160" height="80" rx="14" fill="#121827" stroke="#ffd166" stroke-width="2"/><text y="-26" font-size="17" font-weight="700" fill="#ffd166">5 · Measure</text><text y="-4" font-size="12" fill="#8b9bb4">results feed back in</text></g>
 <text x="600" y="250" font-family="Consolas,Menlo,monospace" font-size="13" fill="#8b9bb4">lead scoring · personalised outreach · support triage · content at scale</text>
