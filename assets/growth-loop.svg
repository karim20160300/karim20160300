 <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1200" height="300" rx="18" fill="url(#bg)"/>
<text x="600" y="44" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" fill="#e6edf3">The AI Growth Loop · automations that learn</text>
<path id="loop" d="M140 160 H1060 Q1110 160 1110 210 Q1110 260 1060 260 H140 Q90 260 90 210 Q90 160 140 160 Z" fill="none" stroke="#ffd166" stroke-opacity=".3" stroke-width="2" stroke-dasharray="6 6"/>
<circle r="7" fill="#ffd166" filter="url(#g)"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#loop"/></animateMotion></circle>
<g font-family="Segoe UI,Helvetica,Arial,sans-serif" text-anchor="middle">
